<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TermsRadar Dashboard</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --border-color: rgba(255, 255, 255, 0.1);
      --accent-cyan: #38bdf8;
      --accent-purple: #818cf8;
      --accent-green: #34d399;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 360px;
      min-height: 480px;
      background: var(--bg-gradient);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 18px;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(52, 211, 153, 0.15);
      border: 1px solid var(--accent-green);
      color: var(--accent-green);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      background-color: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-green);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: var(--card-bg);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 8px;
      text-align: center;
    }

    .stat-number {
      font-size: 20px;
      font-weight: 800;
      color: var(--accent-cyan);
      margin-bottom: 2px;
    }

    .stat-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-section {
      background: var(--card-bg);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 11px;
      color: var(--text-muted);
    }

    input[type="text"] {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--text-main);
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent-cyan);
    }

    .btn-save {
      margin-top: 10px;
      background: linear-gradient(90deg, #2563eb, #7c3aed);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s;
    }

    .btn-save:hover {
      opacity: 0.9;
    }

    .saved-toast {
      display: none;
      margin-top: 6px;
      font-size: 11px;
      color: var(--accent-green);
      text-align: center;
    }

    .footer {
      text-align: center;
      font-size: 10px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <span>🛡️</span> TermsRadar
    </div>
    <div class="status-badge">
      <div class="pulse-dot"></div> Protection Active
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-number" id="stat-tc">0</div>
      <div class="stat-label">T&C Scans</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="stat-blocked" style="color: #f87171;">0</div>
      <div class="stat-label">Blocked</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="stat-downloads" style="color: #34d399;">0</div>
      <div class="stat-label">Safe Files</div>
    </div>
  </div>

  <div class="card-section">
    <div class="section-title">
      <span>⚙️</span> Backend Configuration
    </div>
    <div class="form-group">
      <label for="worker-url">Cloudflare Worker Endpoint URL</label>
      <input type="text" id="worker-url" placeholder="https://trust-shield-backend.workers.dev">
      <button class="btn-save" id="btn-save">Save Endpoint Settings</button>
      <div class="saved-toast" id="save-toast">✓ Worker URL saved successfully!</div>
    </div>
  </div>

  <div class="footer">
    TermsRadar MV3 • Serverless Cloudflare KV & Gemini 1.5
  </div>

  <script src="popup.js"></script>
</body>
</html>
